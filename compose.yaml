services:
    postgres:
        image: postgres:18.6-alpine
        restart: unless-stopped
        shm_size: 128mb
        environment:
            POSTGRES_DB: typing_analytics
            POSTGRES_USER: typing_analytics
            POSTGRES_PASSWORD: typing_analytics_local
        ports:
            - '127.0.0.1:5433:5432'
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    postgres_data:
