services:
    postgres:
        image: postgres:18.6-alpine
        restart: unless-stopped
        shm_size: 128mb
        environment:
            POSTGRES_DB: typing_analytics
            POSTGRES_USER: typing_analytics
            POSTGRES_PASSWORD: typing_analytics_local
        ports:
            - '127.0.0.1:5433:5432'
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
            interval: 5s
            timeout: 5s
            retries: 10

    postgres-test:
        image: postgres:18.6-alpine
        profiles:
            - test
        shm_size: 128mb
        environment:
            POSTGRES_DB: typing_analytics_test
            POSTGRES_USER: typing_analytics
            POSTGRES_PASSWORD: typing_analytics_test_local
        ports:
            - '127.0.0.1:5434:5432'
        tmpfs:
            - /var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
            interval: 5s
            timeout: 5s
            retries: 10

    postgres-e2e:
        image: postgres:18.6-alpine
        profiles:
            - e2e
        shm_size: 128mb
        environment:
            POSTGRES_DB: typing_analytics_e2e
            POSTGRES_USER: typing_analytics
            POSTGRES_PASSWORD: typing_analytics_e2e_local
        ports:
            - '127.0.0.1:5435:5432'
        tmpfs:
            - /var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
            interval: 5s
            timeout: 5s
            retries: 10

    mongo:
        image: mongo:8.2
        restart: unless-stopped
        ports:
            - '127.0.0.1:27017:27017'
        volumes:
            - mongo_data:/data/db
        healthcheck:
            test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ ping: 1 })']
            interval: 5s
            timeout: 5s
            retries: 10

    mongo-test:
        image: mongo:8.2
        profiles:
            - test
        ports:
            - '127.0.0.1:27018:27017'
        tmpfs:
            - /data/db
        healthcheck:
            test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ ping: 1 })']
            interval: 5s
            timeout: 5s
            retries: 10

    mongo-e2e:
        image: mongo:8.2
        profiles:
            - e2e
        ports:
            - '127.0.0.1:27019:27017'
        tmpfs:
            - /data/db
        healthcheck:
            test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ ping: 1 })']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    postgres_data:
    mongo_data:
