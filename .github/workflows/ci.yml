name: CI

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    validate:
        name: Validate
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup pnpm and Node.js
              uses: pnpm/setup@v3
              with:
                  runtime: node@24.21.0
                  cache: true
                  require-lockfile: true

            - name: Check formatting
              run: pnpm format:check

            - name: Lint
              run: pnpm lint

            - name: Typecheck
              run: pnpm typecheck

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build
              env:
                  NEXT_PUBLIC_API_BASE_URL: https://api.ci.invalid

    api-integration:
        name: API / PostgreSQL + MongoDB Integration
        runs-on: ubuntu-latest

        env:
            NODE_ENV: test
            DATABASE_URL: postgresql://typing_analytics:typing_analytics_test_ci@localhost:5432/typing_analytics_test?schema=public
            PORT: 3002
            WEB_ORIGIN: http://localhost:3000
            JWT_ACCESS_SECRET: typing-analytics-ci-only-access-secret-0123456789abcdef
            JWT_ACCESS_TTL_SECONDS: 900
            REFRESH_TOKEN_TTL_DAYS: 30
            MONGODB_URL: mongodb://localhost:27017
            MONGODB_DB: typing_analytics_test
            EVENT_DELIVERY_AUTOSTART: 'false'

        services:
            postgres:
                image: postgres:18.6-alpine
                env:
                    POSTGRES_DB: typing_analytics_test
                    POSTGRES_USER: typing_analytics
                    POSTGRES_PASSWORD: typing_analytics_test_ci
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U typing_analytics -d typing_analytics_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

            mongo:
                image: mongo:8.2
                ports:
                    - 27017:27017
                options: >-
                    --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup pnpm and Node.js
              uses: pnpm/setup@v3
              with:
                  runtime: node@24.21.0
                  cache: true
                  require-lockfile: true

            - name: Apply database migrations
              run: pnpm --filter @typing-analytics/api prisma:migrate:integration

            - name: Run API integration tests
              run: pnpm --filter @typing-analytics/api test:integration

    e2e:
        name: Critical Full-Stack E2E
        runs-on: ubuntu-latest
        timeout-minutes: 20
        needs:
            - validate
            - api-integration

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup pnpm and Node.js
              uses: pnpm/setup@v3
              with:
                  runtime: node@24.21.0
                  cache: true
                  require-lockfile: true

            - name: Install Chromium
              run: pnpm --filter @typing-analytics/web exec playwright install --with-deps chromium

            - name: Run critical application journeys
              run: pnpm test:e2e
              env:
                  DEBUG: pw:webserver

            - name: Upload Playwright report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v5
              with:
                  name: playwright-report
                  path: apps/web/playwright-report/
                  retention-days: 14
